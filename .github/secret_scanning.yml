# third_party/gitleaks/gitleaks.toml is gitleaks' own config, kept byte for
# byte so the tests can check keysnitch against it. Its allowlist names
# public sample Google API keys from documentation; they are not secrets of
# this project, and keysnitch's generated rules no longer hold them whole.
paths-ignore:
  - "third_party/gitleaks/gitleaks.toml"
